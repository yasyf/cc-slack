name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@48bd52dbd3669f32199fd54ec0fc7e519da67154
    secrets: inherit

  notarize:
    needs: release
    uses: yasyf/homebrew-tap/.github/workflows/notarize-release.yml@48bd52dbd3669f32199fd54ec0fc7e519da67154
    secrets: inherit

  descriptor:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor and sync manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin/scripts/render-descriptor.sh dist "$version" > plugin/bin/cc-slack.binrun
          chmod +x plugin/bin/cc-slack.binrun
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
      - name: Validate descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.9.0 --repo yasyf/binrun --pattern binrun_0.9.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          echo "fa1991af7943c1465429de7792f88bdfe35174c6bfea5a13d91980cdab914870  $RUNNER_TEMP/binrun_0.9.0_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binrun_0.9.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP" binrun
          "$RUNNER_TEMP/binrun" -- parse plugin/bin/cc-slack.binrun
      - name: Move the tag onto the synced descriptor and land it on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/bin/cc-slack.binrun plugin/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "${GITHUB_REF_NAME} already carries its descriptor and manifest"
          else
            git commit -m "chore: sync cc-slack.binrun + manifest to ${GITHUB_REF_NAME}"
            git tag -fa "${GITHUB_REF_NAME}" -m "${GITHUB_REF_NAME}"
            git push --force origin "refs/tags/${GITHUB_REF_NAME}"
          fi
          git fetch origin main
          version="${GITHUB_REF_NAME#v}"
          on_main="$(git show origin/main:plugin/.claude-plugin/plugin.json | jq -r .version)"
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main already carries ${GITHUB_REF_NAME}'s descriptor and manifest"
          elif [ "$(printf '%s\n' "$on_main" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "main already carries the newer ${on_main}, so ${GITHUB_REF_NAME}'s descriptor stays on its tag"
          else
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin/bin/cc-slack.binrun --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Dispatch post-release checks
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in ci.yml guides.yml; do
            for attempt in 1 2 3; do
              if response="$(
                jq -n --arg commit "$COMMIT" '{ref: "main", inputs: {commit: $commit}}' |
                  gh api --method POST \
                    -H "X-GitHub-Api-Version: 2026-03-10" \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                    --input -
              )"; then
                break
              fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 20
            done
            echo "${workflow}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$(jq -er '.workflow_run_id' <<<"$response")"
          done
