name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    secrets: inherit

  descriptor:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor and sync manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin/scripts/render-descriptor.sh dist "$version" > plugin/bin/cc-slack.binrun
          chmod +x plugin/bin/cc-slack.binrun
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
      - name: Validate descriptor
        run: go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse plugin/bin/cc-slack.binrun
      - name: Move the tag onto the synced descriptor and land it on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/bin/cc-slack.binrun plugin/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "${GITHUB_REF_NAME} already carries its descriptor and manifest"
          else
            git commit -m "chore: sync cc-slack.binrun + manifest to ${GITHUB_REF_NAME}"
            git tag -fa "${GITHUB_REF_NAME}" -m "${GITHUB_REF_NAME}"
            git push --force origin "refs/tags/${GITHUB_REF_NAME}"
          fi
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main already carries ${GITHUB_REF_NAME}'s descriptor and manifest"
          else
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin/bin/cc-slack.binrun --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Dispatch and wait for post-release checks
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pids=()
          for workflow in ci.yml guides.yml; do
            response="$(
              jq -n --arg commit "$COMMIT" '{ref: "main", inputs: {commit: $commit}}' |
                gh api --method POST \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                  --input -
            )"
            run_id="$(jq -er '.workflow_run_id' <<<"$response")"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
